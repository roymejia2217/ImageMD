[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[project]
name = "imagemd"
dynamic = ["version"]
description = "Desktop metadata analysis and repair tool for image and video files"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
authors = [{ name = "Roy Mejia" }]
dependencies = [
    "ttkbootstrap==1.20.4",
    "piexif==1.1.3",
    "Pillow==12.3.0",
    "ffmpeg-python==0.2.0",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
]

[project.scripts]
imagemd = "main:main"
imagemd-repair = "repair_tool:main"

[tool.setuptools]
py-modules = ["main", "repair_tool", "check_tz_env"]

[tool.setuptools.dynamic]
version = { attr = "src.__version__" }

[dependency-groups]
dev = ["ruff==0.14.14"]

[tool.setuptools.packages.find]
include = ["src*"]
