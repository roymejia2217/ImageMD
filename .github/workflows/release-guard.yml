name: Release tag guard

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-guard:
    name: Validate release tag and test suite
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the triggering ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up CPython
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up locked dependency resolver
        uses: astral-sh/setup-uv@2ddd2b9cb38ad8efd50337e8ab201519a34c9f24 # v7.1.1
        with:
          version: "0.11.32"
          enable-cache: false

      - name: Require an exact version tag
        shell: sh
        run: |
          set -eu
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            printf 'Release guard requires a tag ref; received %s.\n' "$GITHUB_REF"
            exit 1
          fi
          version="$(python -c 'from src import __version__; print(__version__)')"
          expected_tag="v${version}"
          if [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
            printf 'Tag %s does not match project version tag %s.\n' "$GITHUB_REF_NAME" "$expected_tag"
            exit 1
          fi

      - name: Validate protected-main release provenance
        shell: sh
        run: |
          set -eu
          python -m ci.release_provenance \
            --source-ref "$GITHUB_REF" \
            --main-ref refs/remotes/origin/main \
            --require-tag

      - name: Verify the dependency lock
        shell: sh
        run: |
          set -eu
          uv lock --check

      - name: Install exactly locked dependencies
        shell: sh
        run: |
          set -eu
          uv sync --locked

      - name: Run the complete unittest suite
        shell: sh
        run: |
          set -eu
          uv run python -m unittest discover -v
