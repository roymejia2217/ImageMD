name: PR Governance

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-governance:
    name: Required PR Governance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the trusted base revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Set up CPython
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Fetch pull request commits and files as data
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          case "$PR_NUMBER" in
            ''|*[!0-9]*)
              echo "error: invalid PR number" >&2
              exit 2
              ;;
          esac
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/commits" --paginate --slurp > "$RUNNER_TEMP/commits-pages.json"
          jq -s 'add | map({sha: .sha, subject: (.commit.message | split("\n")[0])})' "$RUNNER_TEMP/commits-pages.json" > "$RUNNER_TEMP/pr-commits.json"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate --slurp > "$RUNNER_TEMP/files-pages.json"
          jq -s 'add | map({filename: .filename, previous_filename: .previous_filename})' "$RUNNER_TEMP/files-pages.json" > "$RUNNER_TEMP/pr-files.json"

      - name: Validate PR title and body
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          python -m ci.governance trusted-pr \
            --title "$PR_TITLE" \
            --body-file "$RUNNER_TEMP/pr-body.md" \
            --commits-file "$RUNNER_TEMP/pr-commits.json" \
            --files-file "$RUNNER_TEMP/pr-files.json"
