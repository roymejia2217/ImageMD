name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up CPython
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Validate pull request commit subjects
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python -m ci.governance commits \
            --base "$PR_BASE_SHA" \
            --head "$PR_HEAD_SHA"

      - name: Set up locked dependency resolver
        uses: astral-sh/setup-uv@2ddd2b9cb38ad8efd50337e8ab201519a34c9f24 # v7.1.1
        with:
          version: "0.11.32"
          enable-cache: false

      - name: Verify the dependency lock
        run: uv lock --check

      - name: Install exactly locked dependencies
        run: uv sync --locked

      - name: Run Ruff lint checks
        run: |
          uv run ruff check .

      - name: Verify Ruff formatting
        run: |
          uv run ruff format --check .

      - name: Audit locked dependencies on Python 3.12 Linux x64
        run: uv audit --locked --python-version 3.12 --python-platform x86_64-unknown-linux-gnu

      - name: Run the complete test suite
        run: uv run python -m unittest discover -v

      - name: Build the distributable wheel
        run: uv build --wheel

  required-ci:
    name: Required CI
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    if: ${{ always() }}
    steps:
      - name: Require quality success
        run: |
          test "${{ needs.quality.result }}" = "success"
