name: Promote release candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string
      candidate_run_id:
        description: Workflow run containing the release candidate
        required: true
        type: string

permissions:
  contents: write
  actions: read
  attestations: read

jobs:
  promote-release:
    name: Promote release candidate
    runs-on: ubuntu-24.04
    environment: production-release
    steps:
      - name: Check out the requested release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the requested release tag
        shell: sh
        run: |
          set -eu
          version="$(python -c 'from src import __version__; print(__version__)')"
          expected_tag="v${version}"
          if [ "${{ inputs.tag }}" != "$expected_tag" ]; then
            printf 'Tag %s does not match project version tag %s.\n' "${{ inputs.tag }}" "$expected_tag"
            exit 1
          fi

      - name: Validate protected-main release provenance
        shell: sh
        run: |
          set -eu
          python -m ci.release_provenance \
            --source-ref "refs/tags/${{ inputs.tag }}" \
            --main-ref refs/remotes/origin/main \
            --require-tag

      - name: Download the release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: imagemd-release-candidate
          run-id: ${{ inputs.candidate_run_id }}
          path: release
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}

      - name: Validate the release candidate contents
        shell: sh
        run: |
          set -eu
          release_version="${{ inputs.tag }}"
          release_version="${release_version#v}"
          metadata_name="$(python packaging/release_assets.py --version "$release_version" --name metadata)"
          sbom_name="$(python packaging/release_assets.py --version "$release_version" --name sbom)"
          checksums_name="$(python packaging/release_assets.py --version "$release_version" --name checksums)"
          cd release
          sha256sum --check "$checksums_name"
          test -f "$metadata_name"
          test -f "$sbom_name"
          candidate_version="$(METADATA_FILE="$metadata_name" python -c 'import json, os; print(json.load(open(os.environ["METADATA_FILE"], encoding="utf-8"))["version"])')"
          test "v${candidate_version}" = "${{ inputs.tag }}"
          package_count="$(find . -maxdepth 1 -type f \( \
            -name '*.deb' -o \
            -name '*.rpm' -o \
            -name '*.pkg.tar.zst' -o \
            -name '*.AppImage' -o \
            -name '*.flatpak' \
          \) | wc -l)"
          test "$package_count" -eq 5
          spdx_count="$(find . -maxdepth 1 -type f -name '*.spdx.json' | wc -l)"
          test "$spdx_count" -eq 1

      - name: Verify release artifact attestations
        shell: sh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh attestation verify release/*.deb \
            --repo ${{ github.repository }} \
            --signer-workflow ${{ github.repository }}/.github/workflows/package.yml \
            --source-ref refs/tags/${{ inputs.tag }} \
            --deny-self-hosted-runners
          gh attestation verify release/*.rpm \
            --repo ${{ github.repository }} \
            --signer-workflow ${{ github.repository }}/.github/workflows/package.yml \
            --source-ref refs/tags/${{ inputs.tag }} \
            --deny-self-hosted-runners
          gh attestation verify release/*.pkg.tar.zst \
            --repo ${{ github.repository }} \
            --signer-workflow ${{ github.repository }}/.github/workflows/package.yml \
            --source-ref refs/tags/${{ inputs.tag }} \
            --deny-self-hosted-runners
          gh attestation verify release/*.AppImage \
            --repo ${{ github.repository }} \
            --signer-workflow ${{ github.repository }}/.github/workflows/package.yml \
            --source-ref refs/tags/${{ inputs.tag }} \
            --deny-self-hosted-runners
          gh attestation verify release/*.flatpak \
            --repo ${{ github.repository }} \
            --signer-workflow ${{ github.repository }}/.github/workflows/package.yml \
            --source-ref refs/tags/${{ inputs.tag }} \
            --deny-self-hosted-runners

      - name: Publish the release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631
        with:
          tag_name: ${{ inputs.tag }}
          files: release/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
