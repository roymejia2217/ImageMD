name: Download package stage
description: Download the immutable package stage and restore its executable contract.
inputs:
  artifact-name:
    description: Name of the immutable stage artifact.
    required: false
    default: imagemd-package-stage
  path:
    description: Destination directory for the stage.
    required: true
  executable-path:
    description: Executable path relative to the stage root.
    required: false
    default: rootfs/usr/bin/imagemd
runs:
  using: composite
  steps:
    - name: Download immutable stage
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.path }}

    - name: Restore executable contract
      shell: sh
      run: |
        set -eu
        stage_root="${{ inputs.path }}"
        test -d "$stage_root"
        test -f "$stage_root/${{ inputs.executable-path }}"
        chmod 0755 "$stage_root/${{ inputs.executable-path }}"
        test -x "$stage_root/${{ inputs.executable-path }}"
